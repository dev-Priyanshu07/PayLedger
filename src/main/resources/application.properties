spring.application.name=payg

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payg}
spring.datasource.username=${DB_USER:payg}
spring.datasource.password=${DB_PASSWORD:payg}

# Flyway owns the schema; Hibernate must never touch it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Static per-merchant API keys. Bracket notation keeps the key literal -
# relaxed binding would otherwise mangle the underscores.
payg.api-keys[sk_test_merchant_a]=merchant_a
payg.api-keys[sk_test_merchant_b]=merchant_b

# M2 worker. How long a claimed payment's lease lasts before it is treated
# as abandoned, how often a worker polls for INITIATED payments, how many it
# will drain in one poll before yielding, and how often the reaper checks for
# lapsed PROCESSING leases.
payg.worker.lease-seconds=30
payg.worker.poll-interval-ms=500
payg.worker.batch-size=20
payg.worker.reap-interval-ms=5000
